name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ihyonoo/mediledger-equiptrace

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blockchain/besu/package-lock.json
      - name: Test Besu contract and key handling
        working-directory: blockchain/besu
        run: |
          npm ci
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test deploy safeguards
        run: |
          python -m pip install pytest pyyaml
          python -m pytest deploy/tests -q

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: web
            context: ./frontend
            file: frontend/Dockerfile
          - service: simulator
            context: .
            file: simulation/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    if: vars.DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Load deploy-only SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust homeserver host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        # 홈서버 authorized_keys의 forced-command(deploy/ci-deploy.sh)가
        # 실행 명령을 고정하고 여기 전달한 SHA를 서버에서 검증한다.
        # exit code만 forced-command 결과가 그대로 전달된다.
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" "${{ github.sha }}"
