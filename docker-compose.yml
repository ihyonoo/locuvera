# docker-compose.yml (저장소 루트) — 운영 서버 상시 배포용
# 로컬 개발용이 아님. 로컬 개발은 docker-compose.dev.yml을 사용.

# 이 Compose 프로젝트의 이름.
name: mediledger

# blockchain/besu/docker-compose.yml을 그대로 가져옴.
# validator1~4·rpc-node·besu-qbft 네트워크가 여기서 정의됨.
include:
  - blockchain/besu/docker-compose.yml

services:
  redis:
    image: redis:7-alpine
    container_name: mediledger-redis
    restart: unless-stopped
    networks:
      # backend가 컨테이너 DNS(redis:6379)로 접근하려면 같은 네트워크에 있어야 함.
      - besu-qbft

  postgres:
    image: postgres:17-alpine
    container_name: mediledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediledger_db
      POSTGRES_USER: mediledger
      # 루트 .env에서 주입.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # named 볼륨. 익명 볼륨 금지.
      # 익명 볼륨은 컨테이너 재생성 시 새로 만들어져 데이터가 유실될 수 있음.
      - pgdata:/var/lib/postgresql/data
    networks:
      # backend가 besu-rpc-node에 접근하려면 같은 네트워크에 있어야 함.
      - besu-qbft

  backend:
    # 이미지는 GitHub Actions CI가 빌드해 GHCR에 push한다.
    # 운영 서버는 이 태그를 pull만 하며 docker compose build를 쓰지 않는다.
    # .github/workflows/deploy.yml, deploy/ci-deploy.sh 참고.
    image: ghcr.io/ihyonoo/mediledger-equiptrace-backend:${DEPLOY_IMAGE_TAG:-latest}
    container_name: mediledger-backend
    restart: unless-stopped
    # DATABASE_URL·AUTH_TOKEN_SECRET 등 나머지 설정은 여기서 주입.
    env_file: .env
    environment:
      # 컨테이너 네트워크 내부 DNS로 접근.
      # 호스트 전용 포트인 8549는 여기선 쓰지 않음.
      BESU_RPC_URL: http://besu-rpc-node:8545
    volumes:
      # 컨트랙트 배포 산출물을 런타임에 참조.
      # 체인을 재배포해 주소가 바뀌면 이 파일도 갱신해야 함.
      - ./blockchain/besu/deployments:/app/blockchain/besu/deployments:ro
    depends_on:
      - postgres
      - redis
    networks:
      - besu-qbft
      - simulator-api

  simulator:
    # backend/web과 동일 — GHCR에서 pull만 한다.
    image: ghcr.io/ihyonoo/mediledger-equiptrace-simulator:${DEPLOY_IMAGE_TAG:-latest}
    container_name: mediledger-simulator
    restart: unless-stopped
    environment:
      # 컨테이너 네트워크 내부 DNS로 backend에 접근.
      BACKEND_BASE_URL: http://backend:8000
      SIM_STAFF_PASSWORD: ${SIM_STAFF_PASSWORD:?SIM_STAFF_PASSWORD required}
      RTLS_SIM_KEY: ${RTLS_SIM_KEY:?RTLS_SIM_KEY required}
      SIM_HTTP_TIMEOUT_SEC: ${SIM_HTTP_TIMEOUT_SEC:-10}
      SIM_INGEST_TIMEOUT_SEC: ${SIM_INGEST_TIMEOUT_SEC:-5}
      RETURN_HTTP_TIMEOUT_SEC: ${RETURN_HTTP_TIMEOUT_SEC:-40}
      SIM_RANDOM_SEED: ${SIM_RANDOM_SEED:-}
    depends_on:
      - backend
    networks:
      - simulator-api

  web:
    # backend와 동일 — GHCR에서 pull만 한다.
    image: ghcr.io/ihyonoo/mediledger-equiptrace-web:${DEPLOY_IMAGE_TAG:-latest}
    container_name: mediledger-web
    restart: unless-stopped
    volumes:
      # nginx 설정은 이미지에 굽지 않고 런타임에 주입.
      # /api를 backend로 리버스 프록시하는 규칙이 여기 있음.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - besu-qbft

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mediledger-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust에서 발급한 터널 토큰.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - besu-qbft

volumes:
  # docker compose down -v로만 삭제됨.
  pgdata:

networks:
  besu-qbft:
    # 실제 driver·subnet 설정은 include된 besu 스택 쪽에 있음.
    # 여기서는 외부 네트워크가 아님을 명시.
    external: false
  simulator-api:
    driver: bridge
